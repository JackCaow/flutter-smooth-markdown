name: flutter_smooth_markdown_example
description: Example app for flutter_smooth_markdown package
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_smooth_markdown:
    path: ../
  http: ^1.2.0

dev_dependencies:
  ffi: ^2.1.4
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gallery/ridgeline.jpg
    - assets/gallery/brand-mark.png
